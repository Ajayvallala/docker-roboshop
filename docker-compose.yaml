networks:
  default:
   driver: bridge
   name: roboshop
   #external: true #I created network already using docker network create roboshop

volumes:
  mongodb:
  mysql:
  redis:
  rabbitmq:

services:
  mongodb:
   image: ajayvallala/mongodb:v1
   container_name: mongodb
   volumes:
     - mongodb:/data/db
  catalogue:
   image: ajayvallala/catalogue:v1
   container_name: catalogue
   depends_on:
   - mongodb
  redis:
   image: redis:7.0
   container_name: redis
   volumes:
     - redis:/data
  user:
   image: ajayvallala/user:v1
   container_name: user
   depends_on:
   - redis
   - mongodb
  cart:
   image: ajayvallala/cart:v1
   container_name: cart
   depends_on:
   - redis
   - catalogue
  mysql:
   image: ajayvallala/mysql:v1
   container_name: mysql
   volumes:
     - mysql:/var/lib/mysql
  shipping:
   image: ajayvallala/shipping:v1
   container_name: shipping
   depends_on:
   - cart
   - mysql
  rabbitmq:
   image: rabbitmq:3
   container_name: rabbitmq
   volumes:
     - rabbitmq:/var/lib/rabbitmq
   environment:
    RABBITMQ_DEFAULT_USER: roboshop 
    RABBITMQ_DEFAULT_PASS: roboshop123
  payment:
   image: ajayvallala/payment:v1
   container_name: payment
   environment:
    CART_HOST: cart
    CART_PORT: 8080 
    USER_HOST: user
    USER_PORT: 8080
    AMQP_HOST: rabbitmq
    AMQP_USER: roboshop
    AMQP_PASS: roboshop123
   depends_on:
   - cart
   - user
   - rabbitmq
  frontend:
   image: ajayvallala/frontend:v1
   container_name: frontend
   ports:
     - "80:80"
   depends_on:
   - catalogue
   - user
   - cart
   - shipping
   - payment