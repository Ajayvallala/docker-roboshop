networks:
  default:
   driver: bridge
   name: roboshop
   #external: true #I created network already using docker network create roboshop
     
services:
  mongodb:
   image: ajayvallala/mongodb:v1
   container_name: mongodb
  catalogue:
   image: ajayvallala/catalogue:v1
   container_name: catalogue
   depends_on:
   - mongodb
  redis:
   image: redis:7.0
   container_name: redis
  user:
   image: ajayvallala/user:v1
   container_name: user
   depends_on:
   - redis
   - mongodb
  cart:
   image: ajayvallala/cart:v1
   container_name: cart
   depends_on:
   - redis
   - catalogue
  mysql:
   image: ajayvallala/mysql:v1
   container_name: mysql
  shipping:
   image: ajayvallala/shipping:v1
   container_name: shipping
   depends_on:
   - cart
   - mysql
  rabbitmq:
   image: rabbitmq:3
   container_name: rabbitmq
   environment:
    RABBITMQ_DEFAULT_USER: roboshop 
    RABBITMQ_DEFAULT_PASS: roboshop123
  payment:
   image: ajayvallala/payment:v1
   container_name: payment
   depends_on:
   - cart
   - user
   - rabbitmq
  frontend:
   image: ajayvallala/frontend:v1
   container_name: frontend
   ports:
     - "80:80"
   depends_on:
   - catalogue
   - user
   - cart
   - shipping
   - payment